<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E8A87C&quot;,&quot;options&quot;:[&quot;#E8A87C&quot;,&quot;#C9B6E4&quot;,&quot;#F2C879&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { on: [true, true, false] };
}
renderVals() {
const defs = [
{ t: 'Recordatorio diario', m: 'Cada noche a las 21:00' },
{ t: 'Bloqueo con huella', m: 'Nadie más abre tus chats' },
{ t: 'Notificaciones discretas', m: 'Sin texto en la pantalla bloqueada' }
];
const on = this.state.on;
return {
accent: this.props.accent ?? '#E8A87C',
toggles: defs.map((d, i) => ({
t: d.t,
m: d.m,
pressed: on[i] ? 'true' : 'false',
toggle: () => { const n = on.slice(); n[i] = !n[i]; this.setState({ on: n }); },
track: 'width: 52px; height: 32px; flex-shrink: 0; border-radius: 16px; border: 0; padding: 3px; display: flex; cursor: pointer; justify-content: ' + (on[i] ? 'flex-end' : 'flex-start') + '; background: ' + (on[i] ? '#2F4A3E' : '#C9D0C6') + ';'
}))
};
}
}
</script>
