<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E8A87C&quot;,&quot;options&quot;:[&quot;#E8A87C&quot;,&quot;#C9B6E4&quot;,&quot;#F2C879&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { mood: 2 };
}
renderVals() {
const defs = [
{ label: 'Muy mal', c: '#8E9C95' },
{ label: 'Mal', c: '#AFC0B4' },
{ label: 'Regular', c: '#C9D3C5' },
{ label: 'Bien', c: '#EFC6A4' },
{ label: 'Muy bien', c: '#E8A87C' }
];
const sel = this.state.mood;
return {
accent: this.props.accent ?? '#E8A87C',
moods: defs.map((d, i) => ({
label: d.label,
pressed: i === sel ? 'true' : 'false',
pick: () => this.setState({ mood: i }),
style: 'min-height: 72px; border-radius: 16px; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px 2px; cursor: pointer; ' + (i === sel ? 'border: 1.5px solid #1F2A26; background: #F3F4EF;' : 'border: 1px solid transparent; background: #FFFFFF;'),
dot: 'width: 28px; height: 28px; border-radius: 14px; background: ' + d.c + ';'
}))
};
}
}
</script>
