<x-dc>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F4EF; font-family: 'Figtree', system-ui, sans-serif; color: #1F2A26; overflow: hidden">

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 14px">

    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.6px">Recursos</h1>

    <div style="position: relative">
      <label for="buscar" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar</label>
      <input id="buscar" type="search" placeholder="Buscar ejercicios o guías" style="width: 100%; height: 48px; box-sizing: border-box; border-radius: 24px; border: 1px solid #D5DBD2; background: #FFFFFF; padding: 0 16px 0 44px; font-family: inherit; font-size: 15px; color: #1F2A26">
      <svg width="18" height="18" fill="none" stroke="#4C5853" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 16px; top: 15px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    </div>

    <div style="display: flex; gap: 8px; overflow: hidden">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <button sc-camel-on-click="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>

    <a href="#" style="height: 128px; box-sizing: border-box; border-radius: 22px; background: #DDE6DC; padding: 16px; display: flex; gap: 14px; text-decoration: none; color: #1F2A26; position: relative; overflow: hidden">
      <div style="display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; position: relative">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #2F4A3E">Guía · 5 min</span>
        <span style="font-size: 18px; line-height: 1.25; font-weight: 700; max-width: 200px">Entender la depresión sin culparte</span>
      </div>
      <svg width="110" height="110" fill="none" aria-hidden="true" style="flex-shrink: 0; margin: -6px -6px 0 0"><circle cx="70" cy="80" r="46" fill="{{accent}}" opacity="0.4"></circle><circle cx="70" cy="80" r="28" fill="{{accent}}"></circle><path d="M0 96 C 30 84, 60 92, 110 86 V110 H0Z" fill="#5E7F6E"></path></svg>
    </a>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 600">Ejercicios</span>
      <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
        <button style="display: flex; align-items: center; gap: 12px; padding: 10px; border: 0; border-radius: 18px; background: #FFFFFF; font-family: inherit; text-align: left; color: #1F2A26">
          <span style="width: 44px; height: 44px; border-radius: 14px; background: {{it.bg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="16" height="16" fill="#1F2A26" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
            <span style="font-size: 14.5px; font-weight: 600">{{it.t}}</span>
            <span style="font-size: 12.5px; color: #4C5853">{{it.m}}</span>
          </span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 600">Ayuda profesional</span>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: #F6DCD3; text-decoration: none; color: #1F2A26">
        <svg width="22" height="22" fill="none" stroke="#7A2E1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14.5px; font-weight: 700; color: #7A2E1E">Línea 113, opción 5</span>
          <span style="font-size: 12.5px; color: #5C2A1E">Salud mental · gratis, 24 horas</span>
        </span>
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: #FFFFFF; text-decoration: none; color: #1F2A26">
        <svg width="22" height="22" fill="none" stroke="#2F4A3E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14.5px; font-weight: 600">Centros de salud mental cerca</span>
          <span style="font-size: 12.5px; color: #4C5853">Psicólogos y CSMC en tu zona</span>
        </span>
      </a>
    </div>
  </div>

  <nav style="flex-shrink: 0; height: 76px; box-sizing: border-box; padding: 6px 12px 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E1E4DC">
    <a href="Inicio.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #4C5853; font-size: 11.5px">
      <svg width="22" height="22" fill="none" stroke="#4C5853" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="Registro.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #4C5853; font-size: 11.5px">
      <svg width="22" height="22" fill="none" stroke="#4C5853" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Registro</a>
    <a href="Recursos.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #1F2A26; font-size: 11.5px; font-weight: 700">
      <svg width="22" height="22" fill="none" stroke="#1F2A26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path></svg>Recursos</a>
    <a href="Perfil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #4C5853; font-size: 11.5px">
      <svg width="22" height="22" fill="none" stroke="#4C5853" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Perfil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E8A87C&quot;,&quot;options&quot;:[&quot;#E8A87C&quot;,&quot;#C9B6E4&quot;,&quot;#F2C879&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cat: 0 };
}
renderVals() {
const labels = ['Todo', 'Respirar', 'Dormir', 'Ansiedad', 'Ánimo'];
const sel = this.state.cat;
return {
accent: this.props.accent ?? '#E8A87C',
cats: labels.map((l, i) => ({
label: l,
pressed: i === sel ? 'true' : 'false',
pick: () => this.setState({ cat: i }),
style: 'height: 40px; padding: 0 16px; flex-shrink: 0; border-radius: 20px; font-family: inherit; font-size: 13.5px; cursor: pointer; ' + (i === sel ? 'border: 0; background: #1F2A26; color: #F3F4EF; font-weight: 600;' : 'border: 1px solid #D5DBD2; background: #FFFFFF; color: #1F2A26;')
})),
items: [
{ t: 'Respiración 4-7-8', m: 'Respirar · 2 min', bg: '#FBEBDF' },
{ t: 'Escaneo corporal para dormir', m: 'Dormir · 8 min', bg: '#E6E1F1' },
{ t: 'Tres cosas buenas de hoy', m: 'Ánimo · 5 min', bg: '#DDE6DC' }
]
};
}
}
</script>
